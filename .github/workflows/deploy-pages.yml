name: Publish RV CONTROL

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: rv-control-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish standalone web app
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out RV CONTROL
        uses: actions/checkout@v4
      - name: Configure GitHub Pages (enable if needed)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare public assets
        run: |
          mkdir -p dist
          cp index.html dist/index.html
          touch dist/.nojekyll
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
