name: Publish RV CONTROL

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'rv-modules.js'
      - 'mall-payroll.js'
      - 'mall-performance.js'
      - 'combined-payroll.js'
      - 'hr-control.js'
      - 'scripts/check-rv.mjs'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: rv-control-pages
  cancel-in-progress: false

jobs:
  build:
    name: Validate and prepare independent RV CONTROL site
    runs-on: ubuntu-latest
    steps:
      - name: Check out independent RV CONTROL
        uses: actions/checkout@v4
      - name: Validate JavaScript and DOM references
        run: node scripts/check-rv.mjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare complete static website
        run: |
          mkdir -p dist
          cp index.html rv-modules.js mall-payroll.js mall-performance.js combined-payroll.js hr-control.js dist/
          touch dist/.nojekyll
          test -s dist/index.html
          test -s dist/rv-modules.js
          test -s dist/mall-payroll.js
          test -s dist/mall-performance.js
          test -s dist/combined-payroll.js
          test -s dist/hr-control.js
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy RV CONTROL to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
